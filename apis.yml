name: Wikifolio
description: >-
  wikifolio (wikifolio Financial Technologies AG) is a European social- and
  copy-trading platform that lets everyday investors follow, compare, and invest
  in the strategies of experienced traders. Traders build virtual portfolios
  ("wikifolios") that are published transparently; in Germany, Austria, and
  Switzerland the best-performing wikifolios can be securitized as exchange-listed
  wikifolio certificates that investors buy through their bank or broker. The
  platform surfaces thousands of trading ideas with published rules, fees, and
  live performance tracking. wikifolio was surfaced as a portfolio company of
  Speedinvest and is profiled in the API Evangelist network; it does not appear
  to publish a public developer API at this time.
